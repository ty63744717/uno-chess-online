<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNO Chess</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171717;color:#fff;font-family:Arial,sans-serif;text-align:center}
#game{width:min(96vw,820px);margin:auto;padding:20px}
h1{margin:0 0 12px}
#info{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
#captureSummary{display:flex;flex-direction:column;gap:4px;margin:0 auto 12px;max-width:640px;text-align:left}
.player-capture{display:flex;align-items:center;gap:8px;min-height:42px;padding:4px 8px;background:#222;border-radius:6px}
.player-avatar{width:36px;height:36px;flex:0 0 36px;background:#555;border-radius:4px;position:relative;overflow:hidden}
.player-avatar:before{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:#ddd;left:12px;top:6px}
.player-avatar:after{content:"";position:absolute;width:25px;height:15px;border-radius:13px 13px 0 0;background:#ddd;left:5px;bottom:2px}
.player-name{width:28px;font-weight:bold;font-size:14px}
.player-pieces{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden}
.player-pieces .capture-piece{font-size:23px;line-height:30px;width:25px;text-align:center}
.capture-piece.black{color:#111;text-shadow:0 0 1px #fff}.capture-piece.white{color:#fff;text-shadow:0 0 2px #000}
.player-score{font-size:14px;color:#aaa;margin-left:2px;white-space:nowrap}
#board{width:min(90vw,640px);height:min(90vw,640px);margin:auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:4px solid #555}
.square{width:100%;height:100%;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,7vw,58px);cursor:pointer;user-select:none;position:relative}
.light{background:#eaedd1}.dark{background:#769557}
.selected{outline:5px solid #f5c542;outline-offset:-5px}.white-piece{color:#fff;text-shadow:0 0 2px #000,0 1px 2px #000}.black-piece{color:#111;text-shadow:0 0 1px #fff}
.legal{box-shadow:inset 0 0 0 6px rgba(255,255,255,.55)}
.wild-promotable{box-shadow:inset 0 0 0 6px rgba(255,255,255,.55)}
#card{margin:16px auto 8px;width:180px;height:90px;border-radius:12px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px}
button{padding:10px 18px;font-size:16px;cursor:pointer;border:0;border-radius:8px}
.small-btn{padding:7px 10px;font-size:14px}
#log{margin-top:12px;text-align:left;background:#222;padding:10px;height:110px;overflow:auto}
#cardArea{height:125px;display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:10px;margin:8px auto 14px;max-width:640px;position:relative}
.card-pile{height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:13px;color:#aaa}
.deck-card,.used-card,.flying-card{width:72px;height:92px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.deck-card{background:#d71920;color:#fff;border:3px solid #fff;cursor:pointer;transform:rotate(-2deg)}
.deck-card:hover{transform:rotate(-2deg) scale(1.04)}
.used-card{background:#fff;color:#111;border:3px solid #222;font-size:18px}
.card-value{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:12px;color:#111}
.owner-white{background:#fff!important;color:#111!important;box-shadow:0 0 0 3px #fff,0 4px 10px rgba(0,0,0,.4)}
.owner-black{background:#111!important;color:#fff!important;box-shadow:0 0 0 3px #111,0 4px 10px rgba(0,0,0,.4)}
.owner-label{position:absolute;bottom:2px;left:0;right:0;font-size:9px;color:#111;text-align:center;z-index:2}
#cardStage{height:110px;position:relative}
.flying-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.65);background:#fff;color:#111;border:3px solid #222;font-size:18px;z-index:10;animation:cardFly .65s ease-in-out forwards}
@keyframes cardFly{0%{left:50%;top:50%;transform:translate(-50%,-50%) scale(.65);opacity:0}25%{left:50%;top:50%;transform:translate(-50%,-50%) scale(1);opacity:1}100%{left:calc(100% + 50px);top:50%;transform:translate(-50%,-50%) scale(.72);opacity:1}}
#deathScreen,#modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:100}
#deathText{font-family:Georgia,"Times New Roman",serif;font-size:clamp(44px,10vw,100px);font-weight:400;letter-spacing:3px;color:#8f2026;text-shadow:0 2px 5px #000;animation:deathFade 2.2s ease-out forwards}
@keyframes deathFade{0%{opacity:0;transform:scale(1.05)}18%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0}}
.modal-box{width:min(92vw,560px);max-height:85vh;overflow:auto;background:#242424;border:1px solid #555;border-radius:14px;padding:18px;text-align:left}
.modal-box h2{margin:0 0 12px;text-align:center}.modal-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}.choice{background:#eee;color:#111;min-height:60px}.choice:disabled{opacity:.35;cursor:not-allowed}
.capture-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.capture-box{background:#1a1a1a;padding:10px;border-radius:10px;min-height:90px}.captured-piece{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;margin:3px;background:#333;border-radius:8px;cursor:pointer;font-size:34px}.captured-piece.white-captured{color:#fff;text-shadow:0 0 2px #000}.captured-piece.black-captured{color:#111;background:#eee;text-shadow:0 0 1px #fff}.captured-piece.selected-capture{outline:3px solid #f5c542}.count{font-size:13px;color:#aaa;margin-left:4px}.resume-choice{margin-top:10px;text-align:center}.resume-choice button{background:#f5c542;color:#111}
#status{min-height:24px;color:#f5c542;margin:8px 0}
@media(max-width:600px){#game{padding:10px}.capture-columns{grid-template-columns:1fr}.modal-box{padding:12px}}
</style>

<style id="online-css">
#lobby{position:fixed;inset:0;background:#111;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}
#lobby.hidden{display:none}
.lobby-box{width:min(92vw,460px);background:#242424;border:1px solid #555;border-radius:18px;padding:24px;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.45)}
.lobby-box h1{margin-top:0}.lobby-box input{width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #555;background:#151515;color:#fff;font-size:16px}
.lobby-box button{margin:6px 3px}.room-code{font-size:34px;letter-spacing:7px;font-weight:bold;color:#f5c542;margin:12px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.player-slot{background:#1a1a1a;border-radius:10px;padding:14px;min-height:70px}
.online-status{font-size:13px;color:#aaa;margin:10px 0}.error{color:#ff7272}.ok{color:#8be28b}
#onlineBar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px auto 8px;width:min(96vw,640px);font-size:13px;color:#aaa}
#onlineBar button{padding:5px 9px;font-size:12px}
#roleBadge{font-weight:bold;color:#f5c542}
#startOnline[disabled]{opacity:.45;cursor:not-allowed}
</style>
</head>
<body><script>document.addEventListener("DOMContentLoaded",()=>document.getElementById("game").style.visibility="hidden");</script>

<div id="lobby">
  <div class="lobby-box">
    <h1>UNO Chess Online</h1>
    <p>공방을 만들어 친구와 실시간으로 대전하세요.</p>
    <input id="nickname" maxlength="12" placeholder="닉네임">
    <button id="createRoom">방 만들기</button>
    <button id="joinRoom">방 참가</button>
    <div id="joinArea" style="display:none">
      <input id="roomCodeInput" maxlength="6" placeholder="방 코드 6자리">
      <button id="joinConfirm">참가하기</button>
    </div>
    <div id="roomArea" style="display:none">
      <div>방 코드</div>
      <div id="roomCode" class="room-code"></div>
      <div class="players">
        <div class="player-slot">백<br><b id="whiteName">대기 중</b></div>
        <div class="player-slot">흑<br><b id="blackName">대기 중</b></div>
      </div>
      <button id="startOnline" disabled>게임 시작</button>
      <button id="leaveRoom">나가기</button>
    </div>
    <div id="lobbyStatus" class="online-status">서버 연결 중…</div>
  </div>
</div>
<div id="onlineBar">
  <span><span id="roleBadge">오프라인</span> · 방 <span id="onlineRoom">-</span></span>
  <button id="onlineLeave">공방 나가기</button>
</div>
<div id="game">
<h1>UNO Chess</h1>
<div id="info">
<span id="turn">백의 차례</span><span id="turnCount">턴: 1</span>
<div><button id="endTurnButton" class="small-btn">턴 종료</button> <button id="capturedButton" class="small-btn">잡은 기물</button> <button id="restartButton" class="small-btn">다시 시작</button></div>
</div>
<div id="captureSummary"></div>
<div id="cardArea">
<div id="deck" class="card-pile" title="카드 뽑기"><div class="deck-card">UNO</div><span>덱</span></div>
<div id="cardStage"></div>
<div id="discardPile" class="card-pile"><div id="card" class="used-card">사용 카드</div><span>사용 카드</span></div>
</div>
<div id="status"></div>
<div id="board"></div>
<div id="deathScreen"><div id="deathText">BLACK DIED</div></div>
<div id="modal"><div class="modal-box" id="modalBox"></div></div>
<div id="log"></div>
</div>
<script>
const pieceNames={K:"킹",Q:"퀸",R:"룩",B:"비숍",N:"나이트",P:"폰"};
const pieceChars={w:{K:"♔",Q:"♕",R:"♖",B:"♗",N:"♘",P:"♙"},b:{K:"♚",Q:"♛",R:"♜",B:"♝",N:"♞",P:"♟"}};
let board=[],currentPlayer="w",turn=1,selected=null,cardDrawn=false,movesRemaining=0,movesUsedThisCard=0,deck=[],discard=[],dead={w:[],b:[]},gameOver=false,lastMove=null,revivalState=null,lastCardOwner=null,pendingChoice=null,wildPromoPiece=null,reverseMode=false;

function valueOf(type){return {P:1,N:3,B:3,R:5,Q:9,K:0}[type]}
function makePiece(color,type){return {color,type,value:valueOf(type),hasMoved:false}}
function createBoard(){
 board=Array.from({length:8},()=>Array(8).fill(null)); const back=["R","N","B","Q","K","B","N","R"];
 for(let c=0;c<8;c++){board[0][c]=makePiece("b",back[c]);board[1][c]=makePiece("b","P");board[6][c]=makePiece("w","P");board[7][c]=makePiece("w",back[c])}
}
function createDeck(){deck=[];const numberCounts={0:2,1:8,2:8,3:6,4:5,5:4,6:3,7:2,8:1,9:1};for(const n of Object.keys(numberCounts)){for(let i=0;i<numberCounts[n];i++)deck.push({type:"number",value:Number(n)})}for(let i=0;i<4;i++)deck.push({type:"skip"},{type:"reverse"},{type:"draw2"});for(let i=0;i<4;i++)deck.push({type:"wild"},{type:"wild4"});shuffle(deck)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function drawCard(){if(deck.length===0){if(discard.length<=1)return null;deck=discard.splice(0);shuffle(deck)}return deck.pop()}
function cardName(card){if(!card)return"카드 없음";if(card.type==="number")return String(card.value);return{skip:"SKIP",reverse:"REVERSE",draw2:"DRAW 2",wild:"WILD",wild4:"WILD +4"}[card.type]}

function render(){
 const el=document.getElementById("board");el.innerHTML="";
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const sq=document.createElement("div");sq.className="square "+((r+c)%2?"dark":"light");
  if(selected&&selected.r===r&&selected.c===c)sq.classList.add("selected");
  const p=board[r][c];
  if(p){
   sq.textContent=pieceChars[p.color][p.type];
   sq.classList.add(p.color==="w"?"white-piece":"black-piece");
   if(p.color===currentPlayer&&cardDrawn)sq.classList.add("legal");
   if(p.color===currentPlayer&&p.type==="P"&&pendingChoice?.type==="wildPawn")sq.classList.add("wild-promotable");
  }
  if(selected&&isLegalMove(selected.r,selected.c,r,c))sq.classList.add("legal");
  sq.onclick=()=>selectSquare(r,c);el.appendChild(sq);
 }
 document.getElementById("turn").textContent=currentPlayer==="w"?"백의 차례":"흑의 차례";
 document.getElementById("turnCount").textContent="턴: "+turn;
 renderCaptureSummary();
}
function setStatus(t=""){document.getElementById("status").textContent=t}
function renderCaptureSummary(){
 const el=document.getElementById("captureSummary");
 const row=(player,capturedColor)=>{
  const list=dead[capturedColor];
  const score=list.reduce((sum,p)=>sum+p.value,0);
  const pieces=list.map(p=>`<span class="capture-piece ${capturedColor==="w"?"white":"black"}">${pieceChars[capturedColor][p.type]}</span>`).join("");
  return `<div class="player-capture"><div class="player-avatar"></div><div class="player-name">${player==="w"?"백":"흑"}</div><div class="player-pieces">${pieces||"<span class=\"player-score\">없음</span>"}</div><div class="player-score">${score?"+"+score:""}</div></div>`;
 };
 el.innerHTML=row("b","w")+row("w","b");
}
function selectSquare(r,c){
 if(gameOver)return;
 if(pendingChoice?.type==="wildPawn"){const p=board[r][c];if(p&&p.color===currentPlayer&&p.type==="P"){pendingChoice={type:"promotion",r,c,fromWild:true};showPromotionPicker()}else setStatus("WILD: 표시된 자신의 폰을 선택하세요.");return}
 if(!cardDrawn)return;
 if(revivalState){if(board[r][c]===null)placeRevival(r,c);return}
 const piece=board[r][c];
 if(selected){if(movePiece(selected.r,selected.c,r,c)){selected=null;render();return}selected=null}
 if(piece&&piece.color===currentPlayer)selected={r,c};render()
}
function isPathClear(fr,fc,tr,tc){const dr=Math.sign(tr-fr),dc=Math.sign(tc-fc);let r=fr+dr,c=fc+dc;while(r!==tr||c!==tc){if(board[r][c]!==null)return false;r+=dr;c+=dc}return true}
function canEnPassant(fr,fc,tr,tc,piece){
 if(piece.type!=="P"||Math.abs(tc-fc)!==1||tr-fr!==(piece.color==="w"?-1:1)||board[tr][tc])return false;
 if(!lastMove||lastMove.piece.type!=="P"||lastMove.piece.color===piece.color||Math.abs(lastMove.from.r-lastMove.to.r)!==2)return false;
 return lastMove.to.r===fr&&lastMove.to.c===tc;
}
function isLegalMove(fr,fc,tr,tc){
 if(fr===tr&&fc===tc)return false;const piece=board[fr][fc],target=board[tr][tc];if(!piece||(target&&target.color===piece.color))return false;
 const dr=tr-fr,dc=tc-fc,adr=Math.abs(dr),adc=Math.abs(dc);
 if(piece.type==="P"){const dir=reverseMode?(piece.color==="w"?1:-1):(piece.color==="w"?-1:1),start=reverseMode?(piece.color==="w"?1:6):(piece.color==="w"?6:1);if(dc===0&&!target&&dr===dir)return true;if(dc===0&&!target&&fr===start&&dr===dir*2&&board[fr+dir][fc]===null)return true;if(adc===1&&dr===dir&&(target||canEnPassant(fr,fc,tr,tc,piece)))return true;return false}
 if(piece.type==="N")return(adr===2&&adc===1)||(adr===1&&adc===2);
 if(piece.type==="B")return adr===adc&&isPathClear(fr,fc,tr,tc);
 if(piece.type==="R")return(dr===0||dc===0)&&isPathClear(fr,fc,tr,tc);
 if(piece.type==="Q")return(adr===adc||(dr===0||dc===0))&&isPathClear(fr,fc,tr,tc);
 if(piece.type==="K"){if(adr<=1&&adc<=1)return true;if(!piece.hasMoved&&dr===0&&adc===2)return canCastle(piece,fr,fc,tr,tc);return false}
 return false
}
function canCastle(king,fr,fc,tr,tc){const rookCol=tc>fc?7:0,rook=board[fr][rookCol];if(!rook||rook.type!=="R"||rook.color!==king.color||rook.hasMoved)return false;const step=tc>fc?1:-1;for(let c=fc+step;c!==rookCol;c+=step)if(board[fr][c])return false;return true}
function movePiece(fr,fc,tr,tc){
 const piece=board[fr][fc];if(!piece||piece.color!==currentPlayer||!isLegalMove(fr,fc,tr,tc))return false;const target=board[tr][tc];
 if(target&&target.color===currentPlayer)return false;
 const old={...piece};
 if(wildPromoPiece && piece._wildPromoToken===wildPromoPiece.token && piece.color===wildPromoPiece.color && target && target.type==="K"){setStatus("WILD 프로모션 기물은 이번 보너스 턴에 킹을 잡을 수 없습니다.");return false}
 if(target&&target.type==="K"&&lastCardOwner===currentPlayer&&movesUsedThisCard>0&&discard.length&&discard[discard.length-1].type==="number"){setStatus("숫자카드의 첫 이동 이후에는 킹을 잡을 수 없습니다.");return false}
 if(target){if(target.type==="K"){board[tr][tc]=piece;board[fr][fc]=null;piece.hasMoved=true;gameOver=true;cardDrawn=false;movesRemaining=0;showDeath(target.color);log((currentPlayer==="w"?"백":"흑")+"이 킹을 잡았습니다.");render();return true}dead[target.color].push({type:target.type,value:target.value});}
 if(piece.type==="P"&&!target&&Math.abs(tc-fc)===1){const captured=board[fr][tc];if(captured&&captured.type==="P"){dead[captured.color].push({type:"P",value:1});board[fr][tc]=null;log("앙파상: 폰을 잡았습니다.")}}
 if(piece.type==="K"&&Math.abs(tc-fc)===2){const rookCol=tc>fc?7:0,newRookCol=tc>fc?5:3;const rook=board[fr][rookCol];board[fr][newRookCol]=rook;board[fr][rookCol]=null;rook.hasMoved=true;log("캐슬링 실행")}
 board[tr][tc]=piece;board[fr][fc]=null;piece.hasMoved=true;
 lastMove={from:{r:fr,c:fc},to:{r:tr,c:tc},piece:{...old}};
 movesUsedThisCard++;
 if(piece.type==="P"&&((!reverseMode&&(piece.color==="w"?tr===0:tr===7))||(reverseMode&&(piece.color==="w"?tr===7:tr===0)))){openPromotion(piece,tr,tc);return true}
 log((currentPlayer==="w"?"백":"흑")+" "+pieceNames[piece.type]+" 이동");consumeMove();return true
}
function consumeMove(){if(movesRemaining>0){movesRemaining--;if(movesRemaining===0)endTurn();else render()}else endTurn()}
function endTurn(){cardDrawn=false;movesRemaining=0;movesUsedThisCard=0;selected=null;revivalState=null;wildPromoPiece=null;pendingChoice=null;setStatus("");currentPlayer=currentPlayer==="w"?"b":"w";turn++;render()}
function manualEndTurn(){if(gameOver)return;if(pendingChoice||revivalState){setStatus("진행 중인 선택을 먼저 완료하거나 취소하세요.");return}endTurn()}

function openPromotion(piece,r,c,fromWild=false){
 cardDrawn=false;selected=null;pendingChoice={type:"promotion",r,c,fromWild};showPromotionPicker()
}
function showPromotionPicker(){
 const {r,c}=pendingChoice;
 openModal(`<h2>폰 프로모션</h2><p>원하는 기물을 선택하세요.</p><div class="choice-grid">${["Q","R","B","N"].map(t=>`<button class="choice" onclick="promote('${t}',${r},${c})">${pieceNames[t]}</button>`).join("")}</div><div class="modal-actions"><button onclick="peekBoard()">보드 보기</button></div>`)
}
function promote(type,r,c){const p=board[r][c];const fromWild=!!pendingChoice?.fromWild;p.type=type;p.value=valueOf(type);if(fromWild){p._wildPromoToken=(p._wildPromoToken||0)+1;wildPromoPiece={color:p.color,token:p._wildPromoToken};pendingChoice=null;closeModal();cardDrawn=true;movesRemaining=1;movesUsedThisCard=0;setStatus("WILD: 프로모션 완료. 이 기물로 1회 이동할 수 있으며 킹은 잡을 수 없습니다.");render();return}pendingChoice=null;closeModal();log("폰이 "+pieceNames[type]+"으로 프로모션되었습니다.");cardDrawn=true;consumeMove()}

function startRevival(count){
 const list=dead[currentPlayer];if(!list.length){log("부활시킬 잡힌 기물이 없습니다.");endTurn();return}
 revivalState={remaining:count,chosenType:null};cardDrawn=false;pendingChoice={type:"revival"};showRevivalPicker()
}
function showRevivalPicker(){
 const list=dead[currentPlayer];if(revivalState.remaining<=0){endTurn();return}
 const counts={};list.forEach(p=>counts[p.type]=(counts[p.type]||0)+1);
 const html=Object.keys(counts).map(type=>`<button class="choice" onclick="chooseRevival('${type}')">${pieceNames[type]} <span class="count">×${counts[type]}</span></button>`).join("");
 openModal(`<h2>부활 선택 (${revivalState.remaining}개 남음)</h2><p>부활할 기물을 하나 고른 뒤 자신의 앞쪽 첫째 또는 둘째 줄의 빈 칸을 클릭하세요.</p><div class="choice-grid">${html||"<p>선택할 기물이 없습니다.</p>"}</div><div class="modal-actions"><button onclick="cancelRevival()">부활 종료</button><button onclick="peekBoard()">보드 보기</button></div>`)
}
function chooseRevival(type){revivalState.chosenType=type;closeModal();cardDrawn=true;setStatus("부활할 기물: "+pieceNames[type]+" — 자신의 앞쪽 첫째 또는 둘째 줄의 빈 칸을 클릭하세요.");render()}
function isRevivalSquare(r){return currentPlayer==="w"?(r===6||r===7):(r===0||r===1)}
function placeRevival(r,c){if(!revivalState||!revivalState.chosenType||board[r][c]||!isRevivalSquare(r)){setStatus("자신 앞쪽 첫째 또는 둘째 줄의 빈 칸을 선택하세요.");return}const type=revivalState.chosenType;const idx=dead[currentPlayer].findIndex(p=>p.type===type);if(idx<0)return;board[r][c]=makePiece(currentPlayer,type);dead[currentPlayer].splice(idx,1);revivalState.remaining--;log(pieceNames[type]+" 부활");revivalState.chosenType=null;setStatus("");if(revivalState.remaining>0&&dead[currentPlayer].length)showRevivalPicker();else endTurn()}
function cancelRevival(){revivalState=null;pendingChoice=null;closeModal();endTurn()}

function peekBoard(){closeModal();setStatus("보드를 확인하세요. 준비되면 아래 버튼으로 선택창을 다시 여세요.");const box=document.getElementById("status");box.innerHTML='<span>보드를 확인하세요.</span> <button class="small-btn" onclick="resumeChoice()">선택창 열기</button>'}
function resumeChoice(){if(!pendingChoice)return;if(pendingChoice.type==="promotion")showPromotionPicker();else if(pendingChoice.type==="revival")showRevivalPicker();else if(pendingChoice.type==="wild"||pendingChoice.type==="wildPawn")openWild();else if(pendingChoice.type==="wild4Choice")showWild4Picker();else if(pendingChoice.type==="wildPromotionSelect")showWildPromotionPicker()}

function showCardOwner(card,owner){const el=document.getElementById("card");el.classList.remove("owner-white","owner-black");el.classList.add(owner==="w"?"owner-white":"owner-black");el.textContent=cardName(card)}
function applyCard(card){showCardOwner(card,lastCardOwner);if(card.type==="number"){movesRemaining=card.value;movesUsedThisCard=0;log("숫자 "+card.value+": "+card.value+"번 이동 가능");if(!movesRemaining)endTurn();return}if(card.type==="skip"){log("SKIP: 차례 스킵");endTurn();return}if(card.type==="reverse"){reverseBoard();return}if(card.type==="draw2"){startRevival(2);return}if(card.type==="wild4"){showWild4Picker();return}if(card.type==="wild"){openWild()}}
function reverseBoard(){const nb=Array.from({length:8},()=>Array(8).fill(null));for(let r=0;r<8;r++)for(let c=0;c<8;c++)nb[7-r][7-c]=board[r][c];board=nb;reverseMode=!reverseMode;lastMove=null;log("REVERSE: 체스판 회전 / 폰 진행 방향 전환");endTurn()}
function showWild4Picker(){
 cardDrawn=false;pendingChoice={type:"wild4Choice"};
 openModal(`<h2>WILD +4</h2><p>원하는 효과를 선택하세요.</p><div class="choice-grid"><button class="choice" onclick="startRevival(4)">4부활</button><button class="choice" onclick="openWild()">WILD 카드</button></div><div class="modal-actions"><button onclick="peekBoard()">보드 보기</button></div>`);
}
function openWild(){
 const hasPawn=board.some(row=>row.some(p=>p&&p.color===currentPlayer&&p.type==="P"));
 if(!hasPawn){setStatus("WILD: 프로모션할 자신의 폰이 없습니다.");endTurn();return}
 cardDrawn=false;pendingChoice={type:"wildPawn"};closeModal();setStatus("WILD: 표시된 폰을 클릭하세요.");render()
}
function showWildPicker(){openWild()}
function wildEffect(type){if(type==="promo")return openWild()}
function showWildPromotionPicker(){openWild()}
function selectWildPromotionPawn(r,c){const p=board[r][c];if(!p||p.color!==currentPlayer||p.type!=="P")return;pendingChoice={type:"promotion",r,c,fromWild:true};showPromotionPicker()}

function showCaptured(){const white=dead.b,black=dead.w;const group=(list,color)=>{if(!list.length)return"<span>없음</span>";return list.map((p,i)=>`<span class="captured-piece ${color==="w"?"white-captured":"black-captured"}" title="${pieceNames[p.type]}">${pieceChars[color][p.type]}</span>`).join("")};openModal(`<h2>잡은 기물</h2><div class="capture-columns"><div class="capture-box"><b>백이 잡은 기물</b><div>${group(white,"b")}</div></div><div class="capture-box"><b>흑이 잡은 기물</b><div>${group(black,"w")}</div></div></div><div class="modal-actions"><button onclick="closeModal()">닫기</button></div>`)}
function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").style.display="flex"}
function closeModal(){document.getElementById("modal").style.display="none"}
function showDeath(deadColor){const screen=document.getElementById("deathScreen"),text=document.getElementById("deathText");text.textContent=deadColor==="w"?"WHITE DIED":"BLACK DIED";screen.style.display="flex";setTimeout(()=>screen.style.display="none",2300)}
function log(text){const el=document.getElementById("log");el.innerHTML="<div>"+text+"</div>"+el.innerHTML}

document.getElementById("deck").onclick=()=>{if(gameOver||cardDrawn||revivalState)return;const card=drawCard();if(!card){log("덱에 카드가 없습니다.");return}lastCardOwner=currentPlayer;cardDrawn=true;const stage=document.getElementById("cardStage"),flying=document.createElement("div");flying.className="flying-card "+(currentPlayer==="w"?"owner-white":"owner-black");flying.textContent=cardName(card);stage.appendChild(flying);flying.addEventListener("animationend",()=>{flying.remove();discard.push(card);applyCard(card);render()},{once:true})};
document.getElementById("capturedButton").onclick=showCaptured;
document.getElementById("endTurnButton").onclick=manualEndTurn;
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
function restartGame(){gameOver=false;currentPlayer="w";turn=1;selected=null;cardDrawn=false;movesRemaining=0;movesUsedThisCard=0;deck=[];discard=[];dead={w:[],b:[]};lastMove=null;revivalState=null;lastCardOwner=null;pendingChoice=null;wildPromoPiece=null;reverseMode=false;document.getElementById("card").textContent="사용 카드";document.getElementById("card").classList.remove("owner-white","owner-black");document.getElementById("log").innerHTML="";document.getElementById("deathScreen").style.display="none";closeModal();setStatus("");createBoard();createDeck();render();log("새 게임 시작")}
document.getElementById("restartButton").onclick=restartGame;
restartGame();
</script>

<script id="multiplayer">
(() => {
  const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
  let ws, myRole=null, roomId=null, nickname="", connected=false, started=false, applyingRemote=false;

  const $ = id => document.getElementById(id);
  const status = (msg, cls="") => { $("lobbyStatus").textContent=msg; $("lobbyStatus").className="online-status "+cls; };
  function send(type, data={}) { if(ws && ws.readyState===1) ws.send(JSON.stringify({type,...data})); }
  function myColor(){ return myRole==="host" ? "w" : myRole==="guest" ? "b" : null; }
  function canAct(){ return started && !gameOver && myColor()===currentPlayer; }
  function notMyTurn(){ setStatus(myColor()==="w" ? "지금은 백의 차례입니다." : "지금은 흑의 차례입니다."); }

  function connect(){
    ws = new WebSocket(WS_URL);
    ws.onopen=()=>{connected=true;status("서버에 연결되었습니다.","ok")};
    ws.onclose=()=>{connected=false;status("서버 연결이 끊겼습니다. 새로고침해 다시 연결하세요.","error")};
    ws.onerror=()=>status("서버에 연결할 수 없습니다.","error");
    ws.onmessage=e=>handle(JSON.parse(e.data));
  }

  function state(){
    return {board,currentPlayer,turn,selected:null,cardDrawn,movesRemaining,movesUsedThisCard,deck,discard,dead,gameOver,lastMove,revivalState,lastCardOwner,pendingChoice,wildPromoPiece,reverseMode};
  }

  function applyState(s){
    if(!s)return;
    applyingRemote=true;
    board=s.board; currentPlayer=s.currentPlayer; turn=s.turn; selected=null;
    cardDrawn=s.cardDrawn; movesRemaining=s.movesRemaining; movesUsedThisCard=s.movesUsedThisCard;
    deck=s.deck; discard=s.discard; dead=s.dead; gameOver=s.gameOver; lastMove=s.lastMove;
    revivalState=s.revivalState; lastCardOwner=s.lastCardOwner; pendingChoice=s.pendingChoice;
    wildPromoPiece=s.wildPromoPiece; reverseMode=s.reverseMode;
    render();
    applyingRemote=false;
  }

  function broadcast(){ if(myRole==="host" && !applyingRemote) send("state",{state:state()}); }

  function showRoom(players){
    $("roomArea").style.display="block";
    $("joinArea").style.display="none";
    updatePlayers(players||{});
  }

  function handle(m){
    if(m.type==="room"){
      roomId=m.room;
      $("roomCode").textContent=m.room;
      $("onlineRoom").textContent=m.room;
      showRoom(m.players);
      if(myRole==="guest") status("방에 참가했습니다. 방장이 게임을 시작할 때까지 기다려 주세요.","ok");
      else status("방이 준비되었습니다. 친구에게 코드를 알려주세요.","ok");
      return;
    }
    if(m.type==="players"){
      updatePlayers(m.players);
      if(myRole==="guest") status(m.players?.white && m.players?.black ? "두 명이 모두 입장했습니다. 방장이 게임을 시작합니다." : "방장이 만든 방에 연결되었습니다.","ok");
      return;
    }
    if(m.type==="role"){
      myRole=m.role;
      $("roleBadge").textContent=m.role==="host"?"방장(백)":"참가자(흑)";
      render();
      return;
    }
    if(m.type==="start"){
      started=true;
      $("lobby").classList.add("hidden");
      $("game").style.visibility="visible";
      if(myRole==="host"){
        restartGame();
        broadcast();
      }
      return;
    }
    if(m.type==="state"){
      applyState(m.state);
      return;
    }
    if(m.type==="command" && myRole==="host"){
      // 참가자의 명령은 흑 차례에만 처리합니다.
      if(!started || currentPlayer!=="b") return;
      applyingRemote=true;
      try{
        if(m.action==="square") selectSquare(m.r,m.c);
        else if(m.action==="draw") localDraw();
        else if(m.action==="end") manualEndTurn();
        else if(m.action==="promotion") promote(m.piece,m.r,m.c);
        else if(m.action==="revival") chooseRevival(m.piece);
        else if(m.action==="cancelRevival") cancelRevival();
      } finally {
        applyingRemote=false;
        broadcast();
      }
      return;
    }
    if(m.type==="error") status(m.message,"error");
  }

  function updatePlayers(p){
    const white=p?.white || "대기 중";
    const black=p?.black || "대기 중";
    $("whiteName").textContent=white;
    $("blackName").textContent=black;
    $("startOnline").disabled=!(white!=="대기 중" && black!=="대기 중" && myRole==="host");
    if(myRole==="guest"){
      $("startOnline").style.display="none";
    }else if(myRole==="host"){
      $("startOnline").style.display="inline-block";
    }
  }

  function localDraw(){
    if(gameOver||cardDrawn||revivalState)return;
    const card=drawCard();
    if(!card){log("덱에 카드가 없습니다.");return}
    lastCardOwner=currentPlayer;
    cardDrawn=true;
    const stage=$("cardStage"),flying=document.createElement("div");
    flying.className="flying-card "+(currentPlayer==="w"?"owner-white":"owner-black");
    flying.textContent=cardName(card);
    stage.appendChild(flying);
    flying.addEventListener("animationend",()=>{
      flying.remove();
      discard.push(card);
      applyCard(card);
      render();
      broadcast();
    },{once:true});
  }

  $("createRoom").onclick=()=>{
    nickname=($("nickname").value||"플레이어").trim();
    if(!nickname)return status("닉네임을 입력하세요.","error");
    send("create",{nickname});
  };

  $("joinRoom").onclick=()=>{
    $("joinArea").style.display="block";
    $("roomCodeInput").focus();
  };

  $("joinConfirm").onclick=()=>{
    nickname=($("nickname").value||"플레이어").trim();
    const code=$("roomCodeInput").value.trim().toUpperCase();
    if(!nickname||code.length!==6)return status("닉네임과 6자리 방 코드를 확인하세요.","error");
    send("join",{nickname,room:code});
  };

  $("startOnline").onclick=()=>{
    if(myRole!=="host")return;
    send("start");
  };

  $("leaveRoom").onclick=$("onlineLeave").onclick=()=>{
    send("leave");
    location.reload();
  };

  // Local game controls are network-aware.
  $("deck").onclick=()=>{
    if(!started){setStatus("게임이 시작된 뒤 카드를 뽑을 수 있습니다.");return}
    if(!canAct()){notMyTurn();return}
    if(myRole==="guest") send("command",{action:"draw"});
    else localDraw();
  };

  $("endTurnButton").onclick=()=>{
    if(!started){setStatus("게임이 시작된 뒤 턴을 종료할 수 있습니다.");return}
    if(!canAct()){notMyTurn();return}
    if(myRole==="guest") send("command",{action:"end"});
    else { manualEndTurn(); broadcast(); }
  };

  $("restartButton").onclick=()=>{
    if(myRole!=="host"){setStatus("다시 시작은 방장만 할 수 있습니다.");return}
    restartGame(); broadcast();
  };

  // 온라인에서는 자기 색과 자기 차례의 기물만 조작합니다.
  const originalRender=render;
  window.render=function(){
    originalRender();
    const mine=myColor();
    document.querySelectorAll("#board .square").forEach((sq,i)=>{
      const r=Math.floor(i/8),c=i%8;
      const piece=board[r]?.[c];
      sq.style.cursor=(started && piece && piece.color===mine && mine===currentPlayer && !gameOver) ? "pointer" : "default";
      sq.onclick=()=>{
        if(!started){setStatus("게임이 시작된 뒤 조작할 수 있습니다.");return}
        if(gameOver)return;
        if(myColor()!==currentPlayer){notMyTurn();return}
        if(piece && piece.color!==myColor() && !selected){setStatus("상대 기물은 조작할 수 없습니다.");return}
        if(myRole==="guest") send("command",{action:"square",r,c});
        else { selectSquare(r,c); broadcast(); }
      };
    });
  };

  // Promotion / revival choices from the guest are sent to the host.
  const realPromote=window.promote;
  const realChooseRevival=window.chooseRevival;
  const realCancelRevival=window.cancelRevival;
  window.promote=(piece,r,c)=>{
    if(!canAct()){notMyTurn();return}
    return myRole==="guest" ? send("command",{action:"promotion",piece,r,c}) : realPromote(piece,r,c);
  };
  window.chooseRevival=(piece)=>{
    if(!canAct()){notMyTurn();return}
    return myRole==="guest" ? send("command",{action:"revival",piece}) : realChooseRevival(piece);
  };
  window.cancelRevival=()=>{
    if(!canAct()){notMyTurn();return}
    return myRole==="guest" ? send("command",{action:"cancelRevival"}) : realCancelRevival();
  };

  connect();
})();
</script>
