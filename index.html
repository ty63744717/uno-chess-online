<style>
*{box-sizing:border-box}body{margin:0;background:#171717;color:#fff;font-family:Arial,sans-serif;text-align:center}#game{width:min(96vw,820px);margin:auto;padding:14px}h1{margin:0 0 10px}#info{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}button{padding:10px 16px;font-size:16px;border:0;border-radius:8px;cursor:pointer}.small-btn{padding:7px 10px;font-size:13px}#captureSummary{display:flex;flex-direction:column;gap:4px;margin:8px auto;max-width:640px;text-align:left}.player-capture{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 8px;background:#222;border-radius:6px}.player-avatar{width:34px;height:34px;background:#555;border-radius:4px;position:relative}.player-avatar:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#ddd;left:12px;top:5px}.player-avatar:after{content:"";position:absolute;width:24px;height:14px;border-radius:12px 12px 0 0;background:#ddd;left:5px;bottom:2px}.player-name{width:28px;font-weight:bold;font-size:14px}.player-pieces{display:flex;gap:2px;overflow:hidden}.capture-piece{font-size:22px;width:24px;text-align:center}.capture-piece.black{color:#111;text-shadow:0 0 1px #fff}.capture-piece.white{color:#fff;text-shadow:0 0 2px #000}.player-score{font-size:13px;color:#aaa;white-space:nowrap}#cardArea{height:118px;display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:10px;margin:8px auto;max-width:640px}.card-pile{height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;color:#aaa}.deck-card,.used-card,.flying-card{width:72px;height:92px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 4px 10px #0008}.deck-card{background:#d71920;color:#fff;border:3px solid #fff;cursor:pointer}.used-card{background:#fff;color:#111;border:3px solid #222;font-size:18px}.owner-white{background:#fff!important;color:#111!important}.owner-black{background:#111!important;color:#fff!important}#cardStage{height:110px;position:relative}.flying-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.65);background:#fff;color:#111;border:3px solid #222;z-index:10;animation:fly .65s ease-in-out forwards}@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{left:calc(100% + 50px);transform:translate(-50%,-50%) scale(.72)}}#status{min-height:25px;color:#f5c542;margin:5px 0}#board{width:min(90vw,640px);height:min(90vw,640px);margin:auto;display:grid;grid-template-columns:repeat(8,1fr);border:4px solid #555;touch-action:manipulation}.square{display:flex;align-items:center;justify-content:center;position:relative;font-size:clamp(28px,7vw,58px);cursor:pointer;user-select:none}.light{background:#eaedd1}.dark{background:#769557}.selected{outline:5px solid #f5c542;outline-offset:-5px}.legal{box-shadow:inset 0 0 0 6px #ffffff88}.wild-promotable{box-shadow:inset 0 0 0 6px #ffffff88}.white-piece{color:#fff;text-shadow:0 0 2px #000}.black-piece{color:#111;text-shadow:0 0 1px #fff}#board.guest-perspective{transform:rotate(180deg)}#board.guest-perspective .square{transform:rotate(180deg)}#log{margin-top:10px;text-align:left;background:#222;padding:10px;height:105px;overflow:auto}#modal,#deathScreen,#lobby{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:1000}.modal-box,.lobby-box{width:min(92vw,560px);max-height:86vh;overflow:auto;background:#242424;border:1px solid #555;border-radius:14px;padding:18px;text-align:left}.modal-box h2,.lobby-box h1{text-align:center;margin-top:0}.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}.choice{background:#eee;color:#111;min-height:60px}.modal-actions{text-align:center;margin-top:14px}.modal-actions button{margin:3px}.capture-columns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.capture-box{background:#1a1a1a;padding:10px;border-radius:10px}.count{font-size:12px;color:#aaa}.captured-piece{display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center;font-size:32px;background:#333;margin:3px;border-radius:7px}#deathText{font-family:Georgia,serif;font-size:clamp(48px,12vw,100px);color:#8f2026;text-shadow:0 2px 5px #000}.online-bar{display:flex;justify-content:space-between;align-items:center;width:min(96vw,640px);margin:4px auto;color:#aaa;font-size:13px}.lobby{display:flex!important}.lobby.hidden{display:none!important}.lobby-box{text-align:center}.lobby-box input{width:100%;padding:12px;margin:6px 0;background:#151515;color:#fff;border:1px solid #555;border-radius:8px;font-size:16px}.room-code{font-size:32px;letter-spacing:6px;color:#f5c542;font-weight:bold;margin:10px}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.player-slot{background:#1a1a1a;border-radius:8px;padding:12px}.online-status{font-size:13px;color:#aaa;margin:8px}.error{color:#ff7272}.ok{color:#8be28b}@media(max-width:600px){#game{padding:9px}.capture-columns{grid-template-columns:1fr}}
</style>

<body>
<div id="lobby" class="lobby"><div class="lobby-box">
<h1>UNO Chess Online</h1><p>친구와 실시간으로 대전하세요.</p>
<input id="nickname" maxlength="12" placeholder="닉네임">
<button id="createRoom">방 만들기</button><button id="joinRoom">방 참가</button>
<div id="joinArea" style="display:none"><input id="roomCodeInput" maxlength="6" placeholder="방 코드 6자리"><button id="joinConfirm">참가하기</button></div>
<div id="roomArea" style="display:none"><div>방 코드</div><div id="roomCode" class="room-code"></div><div class="players"><div class="player-slot">백<br><b id="whiteName">대기 중</b></div><div class="player-slot">흑<br><b id="blackName">대기 중</b></div></div><button id="startOnline" disabled>게임 시작</button><button id="leaveRoom">나가기</button></div>
<div id="lobbyStatus" class="online-status">서버 연결 중…</div></div></div>
<div class="online-bar"><span><b id="roleBadge">연결 중</b> · 방 <span id="onlineRoom">-</span></span><button id="onlineLeave" class="small-btn">나가기</button></div>
<div id="game" style="visibility:hidden"><h1>UNO Chess</h1><div id="info"><span id="turn">백의 차례</span><span id="turnCount">턴: 1</span><div><button id="endTurnButton" class="small-btn">턴 종료</button> <button id="capturedButton" class="small-btn">잡은 기물</button> <button id="restartButton" class="small-btn">다시 시작</button></div></div><div id="captureSummary"></div>
<div id="cardArea"><div class="card-pile"><div id="deck" class="deck-card">UNO</div><span>덱</span></div><div id="cardStage"></div><div class="card-pile"><div id="card" class="used-card">사용 카드</div><span>사용 카드</span></div></div>
<div id="status"></div><div id="board"></div><div id="log"></div></div>
<div id="deathScreen"><div id="deathText"></div></div><div id="modal"><div class="modal-box" id="modalBox"></div></div>
<script>
const pieceNames={K:"킹",Q:"퀸",R:"룩",B:"비숍",N:"나이트",P:"폰"};
const pieceChars={w:{K:"♔",Q:"♕",R:"♖",B:"♗",N:"♘",P:"♙"},b:{K:"♚",Q:"♛",R:"♜",B:"♝",N:"♞",P:"♟"}};
const ONLINE={role:null,room:null,started:false,ws:null,applying:false,lastStateKey:"",lastDiscardKey:"",lastGameOver:false};
let board=[],currentPlayer="w",turn=1,selected=null,cardDrawn=false,movesRemaining=0,movesUsedThisCard=0,deck=[],discard=[],dead={w:[],b:[]},gameOver=false,deathColor=null,lastMove=null,revivalState=null,lastCardOwner=null,pendingChoice=null,wildPromoPiece=null,reverseMode=false;
const $=id=>document.getElementById(id);
function myColor(){return ONLINE.role==="host"?"w":ONLINE.role==="guest"?"b":null}
function localTurn(){return !ONLINE.started||myColor()===currentPlayer}
function canExecuteAction(){return !ONLINE.started||myColor()===currentPlayer||(ONLINE.applying&&ONLINE.role==="host")}
function canOpenChoice(){return !ONLINE.started||myColor()===currentPlayer}
function send(type,data={}){if(ONLINE.ws?.readyState===1)ONLINE.ws.send(JSON.stringify({type,...data}))}
function valueOf(t){return {P:1,N:3,B:3,R:5,Q:9,K:0}[t]||0}
function makePiece(color,type){return {color,type,value:valueOf(type),hasMoved:false}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function createBoard(){board=Array.from({length:8},()=>Array(8).fill(null));const back=["R","N","B","Q","K","B","N","R"];for(let c=0;c<8;c++){board[0][c]=makePiece("b",back[c]);board[1][c]=makePiece("b","P");board[6][c]=makePiece("w","P");board[7][c]=makePiece("w",back[c])}}
function createDeck(){deck=[];const n={0:2,1:8,2:8,3:6,4:5,5:4,6:3,7:2,8:1,9:1};for(const k of Object.keys(n))for(let i=0;i<n[k];i++)deck.push({type:"number",value:+k});for(let i=0;i<4;i++)deck.push({type:"skip"},{type:"reverse"},{type:"draw2"},{type:"wild"},{type:"wild4"});shuffle(deck)}
function drawCard(){if(!deck.length){if(discard.length<=1)return null;deck=discard.splice(0);shuffle(deck)}return deck.pop()}
function cardName(c){return !c?"카드 없음":c.type==="number"?String(c.value):({skip:"SKIP",reverse:"REVERSE",draw2:"DRAW 2",wild:"WILD",wild4:"WILD +4"}[c.type]||c.type)}
function setStatus(t=""){$("status").textContent=t}
function log(t){$("log").innerHTML="<div>"+t+"</div>"+$("log").innerHTML}
function render(){const el=$("board");el.innerHTML="";el.classList.toggle("guest-perspective",ONLINE.role==="guest");for(let r=0;r<8;r++)for(let c=0;c<8;c++){const sq=document.createElement("div");sq.className="square "+((r+c)%2?"dark":"light");if(selected?.r===r&&selected?.c===c)sq.classList.add("selected");const p=board[r][c];if(p){sq.textContent=pieceChars[p.color][p.type];sq.classList.add(p.color==="w"?"white-piece":"black-piece");if(p.color===currentPlayer&&cardDrawn)sq.classList.add("legal");if(p.color===currentPlayer&&p.type==="P"&&pendingChoice?.type==="wildPawn")sq.classList.add("wild-promotable")}if(selected&&isLegalMove(selected.r,selected.c,r,c))sq.classList.add("legal");sq.onclick=()=>handleSquare(r,c);el.appendChild(sq)}$("turn").textContent=currentPlayer==="w"?"백의 차례":"흑의 차례";$("turnCount").textContent="턴: "+turn;renderCaptureSummary()}
function renderCaptureSummary(){const row=(label,col)=>{const list=dead[col],score=list.reduce((a,p)=>a+p.value,0);return `<div class="player-capture"><div class="player-avatar"></div><div class="player-name">${label}</div><div class="player-pieces">${list.length?list.map(p=>`<span class="capture-piece ${col==="w"?"white":"black"}">${pieceChars[col][p.type]}</span>`).join(""):"<span class=player-score>없음</span>"}</div><div class="player-score">${score?"+"+score:""}</div></div>`};$("captureSummary").innerHTML=row("백","b")+row("흑","w")}
function isPathClear(fr,fc,tr,tc){const dr=Math.sign(tr-fr),dc=Math.sign(tc-fc);let r=fr+dr,c=fc+dc;while(r!==tr||c!==tc){if(board[r][c])return false;r+=dr;c+=dc}return true}
function canEnPassant(fr,fc,tr,tc,p){const dir=reverseMode?(p.color==="w"?1:-1):(p.color==="w"?-1:1);if(p.type!=="P"||Math.abs(tc-fc)!==1||tr-fr!==dir||board[tr][tc])return false;if(!lastMove||lastMove.piece.type!=="P"||lastMove.piece.color===p.color||Math.abs(lastMove.from.r-lastMove.to.r)!==2)return false;return lastMove.to.r===fr&&lastMove.to.c===tc}
function canCastle(k,fr,fc,tr,tc){const rc=tc>fc?7:0,rook=board[fr][rc];if(!rook||rook.type!=="R"||rook.color!==k.color||rook.hasMoved)return false;const step=tc>fc?1:-1;for(let c=fc+step;c!==rc;c+=step)if(board[fr][c])return false;return true}
function isLegalMove(fr,fc,tr,tc){if(fr===tr&&fc===tc)return false;const p=board[fr][fc],t=board[tr][tc];if(!p||(t&&t.color===p.color))return false;const dr=tr-fr,dc=tc-fc,adr=Math.abs(dr),adc=Math.abs(dc);if(p.type==="P"){const dir=reverseMode?(p.color==="w"?1:-1):(p.color==="w"?-1:1),start=reverseMode?(p.color==="w"?1:6):(p.color==="w"?6:1);return dc===0&&!t&&(dr===dir||(fr===start&&dr===dir*2&&!board[fr+dir][fc]))||(adc===1&&dr===dir&&(t||canEnPassant(fr,fc,tr,tc,p)))}if(p.type==="N")return adr===2&&adc===1||adr===1&&adc===2;if(p.type==="B")return adr===adc&&isPathClear(fr,fc,tr,tc);if(p.type==="R")return(dr===0||dc===0)&&isPathClear(fr,fc,tr,tc);if(p.type==="Q")return(adr===adc||dr===0||dc===0)&&isPathClear(fr,fc,tr,tc);if(p.type==="K")return adr<=1&&adc<=1||!p.hasMoved&&dr===0&&adc===2&&canCastle(p,fr,fc,tr,tc);return false}
function isRevivalSquare(r){if(currentPlayer==="w")return reverseMode?r===0||r===1:r===6||r===7;return reverseMode?r===6||r===7:r===0||r===1}
function handleSquare(r,c){if(gameOver||!localTurn())return;if(ONLINE.started&&ONLINE.role==="guest"){send("command",{action:"square",r,c});return}selectSquare(r,c)}
function selectSquare(r,c){if(gameOver)return;if(pendingChoice?.type==="wildPawn"){const p=board[r][c];if(p?.color===currentPlayer&&p.type==="P"){pendingChoice={type:"promotion",r,c,fromWild:true};requestChoiceUI();render()}else setStatus("WILD: 표시된 자신의 폰을 선택하세요.");return}if(revivalState){if(!revivalState.chosenType){setStatus("먼저 부활할 기물을 선택하세요.");return}if(!board[r][c])placeRevival(r,c);return}if(!cardDrawn)return;const p=board[r][c];if(selected){if(movePiece(selected.r,selected.c,r,c))return;selected=null}if(p?.color===currentPlayer)selected={r,c};render()}
function movePiece(fr,fc,tr,tc){const p=board[fr][fc],target=board[tr][tc];if(!p||p.color!==currentPlayer||!isLegalMove(fr,fc,tr,tc))return false;if(wildPromoPiece&&p._wildPromoToken===wildPromoPiece.token&&p.color===wildPromoPiece.color&&target?.type==="K"){setStatus("WILD 프로모션 기물은 이번 보너스 이동에서 킹을 잡을 수 없습니다.");return false}if(target?.type==="K"&&lastCardOwner===currentPlayer&&movesUsedThisCard>0&&discard.at(-1)?.type==="number"){setStatus("숫자카드의 첫 이동 이후에는 킹을 잡을 수 없습니다.");return false}const old={...p};if(target){if(target.type==="K"){board[tr][tc]=p;board[fr][fc]=null;p.hasMoved=true;gameOver=true;deathColor=target.color;cardDrawn=false;movesRemaining=0;showDeath(target.color);log((currentPlayer==="w"?"백":"흑")+"이 킹을 잡았습니다.");render();return true}dead[target.color].push({type:target.type,value:target.value})}if(p.type==="P"&&!target&&Math.abs(tc-fc)===1){const captured=board[fr][tc];if(captured?.type==="P"){dead[captured.color].push({type:"P",value:1});board[fr][tc]=null;log("앙파상: 폰을 잡았습니다.")}}if(p.type==="K"&&Math.abs(tc-fc)===2){const rc=tc>fc?7:0,nrc=tc>fc?5:3,rook=board[fr][rc];board[fr][nrc]=rook;board[fr][rc]=null;rook.hasMoved=true;log("캐슬링 실행")}board[tr][tc]=p;board[fr][fc]=null;p.hasMoved=true;lastMove={from:{r:fr,c:fc},to:{r:tr,c:tc},piece:old};movesUsedThisCard++;if(p.type==="P"&&((!reverseMode&&(p.color==="w"?tr===0:tr===7))||(reverseMode&&(p.color==="w"?tr===7:tr===0)))){openPromotion(p,tr,tc,false);return true}log((currentPlayer==="w"?"백":"흑")+" "+pieceNames[p.type]+" 이동");consumeMove();return true}
function consumeMove(){if(movesRemaining>0){movesRemaining--;if(!movesRemaining)endTurn();else{selected=null;render()}}else endTurn()}
function endTurn(){cardDrawn=false;movesRemaining=0;movesUsedThisCard=0;selected=null;revivalState=null;wildPromoPiece=null;pendingChoice=null;setStatus("");currentPlayer=currentPlayer==="w"?"b":"w";turn++;render()}
function manualEndTurn(){if(gameOver)return;if(pendingChoice||revivalState){setStatus("진행 중인 선택을 먼저 완료하세요.");return}endTurn()}
function requestChoiceUI(){if(!canOpenChoice())return;if(pendingChoice?.type==="promotion")showPromotionPicker();else if(pendingChoice?.type==="revival")showRevivalPicker();else if(pendingChoice?.type==="wild4Choice")showWild4Picker();else if(pendingChoice?.type==="wildPawn")setStatus("WILD: 표시된 폰을 클릭하세요.")}
function openPromotion(piece,r,c,fromWild=false){cardDrawn=false;selected=null;pendingChoice={type:"promotion",r,c,fromWild};requestChoiceUI();render()}
function showPromotionPicker(){if(!pendingChoice||pendingChoice.type!=="promotion"||!canOpenChoice())return;const {r,c}=pendingChoice;openModal(`<h2>폰 프로모션</h2><p>원하는 기물을 선택하세요.</p><div class="choice-grid">${["Q","R","B","N"].map(t=>`<button class="choice" data-promotion="${t}">${pieceNames[t]}</button>`).join("")}</div><div class="modal-actions"><button id="peekBtn">보드 보기</button></div>`);document.querySelectorAll("[data-promotion]").forEach(b=>b.onclick=()=>promote(b.dataset.promotion,r,c));$("peekBtn").onclick=()=>peekBoard()}
function promote(type,r,c){if(!pendingChoice||pendingChoice.type!=="promotion"||!canExecuteAction())return;if(ONLINE.started&&ONLINE.role==="guest"&&!ONLINE.applying){send("command",{action:"promotion",piece:type,r,c});return}const p=board[r]?.[c];if(!p||p.color!==currentPlayer||p.type!=="P")return;const fromWild=!!pendingChoice.fromWild;p.type=type;p.value=valueOf(type);pendingChoice=null;closeModal();if(fromWild){p._wildPromoToken=(p._wildPromoToken||0)+1;wildPromoPiece={color:p.color,token:p._wildPromoToken};cardDrawn=true;movesRemaining=1;movesUsedThisCard=0;setStatus("WILD: 프로모션 완료. 이 기물로 1회 이동하세요.");render()}else{log("폰이 "+pieceNames[type]+"으로 프로모션되었습니다.");cardDrawn=true;consumeMove()}}
function startRevival(count){const list=dead[currentPlayer];if(!list.length){log("부활시킬 잡힌 기물이 없습니다.");endTurn();return}revivalState={remaining:count,chosenType:null};cardDrawn=false;pendingChoice={type:"revival"};requestChoiceUI()}
function showRevivalPicker(){if(!revivalState||!canOpenChoice())return;const counts={};dead[currentPlayer].forEach(p=>counts[p.type]=(counts[p.type]||0)+1);openModal(`<h2>부활 선택 (${revivalState.remaining}개 남음)</h2><div class="choice-grid">${Object.keys(counts).map(t=>`<button class="choice" data-revive="${t}">${pieceNames[t]} <span class="count">×${counts[t]}</span></button>`).join("")}</div><div class="modal-actions"><button id="cancelRevive">부활 종료</button><button id="peekRevive">보드 보기</button></div>`);document.querySelectorAll("[data-revive]").forEach(b=>b.onclick=()=>chooseRevival(b.dataset.revive));$("cancelRevive").onclick=cancelRevival;$("peekRevive").onclick=()=>peekBoard()}
function chooseRevival(type){if(!revivalState||!canExecuteAction())return;if(ONLINE.started&&ONLINE.role==="guest"&&!ONLINE.applying){send("command",{action:"revival",piece:type});return}if(!dead[currentPlayer].some(p=>p.type===type))return;revivalState.chosenType=type;pendingChoice=null;closeModal();cardDrawn=true;setStatus("부활할 기물: "+pieceNames[type]+" — 앞쪽 첫째 또는 둘째 줄의 빈 칸을 클릭하세요.");render()}
function placeRevival(r,c){if(!revivalState?.chosenType||board[r][c]||!isRevivalSquare(r)){setStatus("자신 앞쪽 첫째 또는 둘째 줄의 빈 칸을 선택하세요.");return}const type=revivalState.chosenType,idx=dead[currentPlayer].findIndex(p=>p.type===type);if(idx<0)return;board[r][c]=makePiece(currentPlayer,type);dead[currentPlayer].splice(idx,1);revivalState.remaining--;revivalState.chosenType=null;log(pieceNames[type]+" 부활");if(revivalState.remaining>0&&dead[currentPlayer].length){pendingChoice={type:"revival"};requestChoiceUI()}else endTurn();render()}
function cancelRevival(){if(!revivalState||!canExecuteAction())return;if(ONLINE.started&&ONLINE.role==="guest"&&!ONLINE.applying){send("command",{action:"cancelRevival"});return}endTurn()}
function isRevivalState(){return !!revivalState}
function peekBoard(){closeModal();$("status").innerHTML='보드를 확인하세요. <button class="small-btn" id="resumeBtn">선택창 열기</button>';$("resumeBtn").onclick=()=>requestChoiceUI()}
function applyCard(card){showCardOwner(card,lastCardOwner);if(card.type==="number"){movesRemaining=card.value;movesUsedThisCard=0;log("숫자 "+card.value+": "+card.value+"번 이동 가능");if(!movesRemaining)endTurn();return}if(card.type==="skip"){log("SKIP: 차례 스킵");endTurn();return}if(card.type==="reverse"){reverseBoard();return}if(card.type==="draw2"){startRevival(2);return}if(card.type==="wild4"){cardDrawn=false;pendingChoice={type:"wild4Choice"};requestChoiceUI();return}if(card.type==="wild"){openWild();return}}
function reverseBoard(){const nb=Array.from({length:8},()=>Array(8).fill(null));for(let r=0;r<8;r++)for(let c=0;c<8;c++)nb[7-r][7-c]=board[r][c];board=nb;reverseMode=!reverseMode;lastMove=null;log("REVERSE: 체스판 회전 / 폰 진행 방향 전환");endTurn()}
function openWild(){const hasPawn=board.some(row=>row.some(p=>p?.color===currentPlayer&&p.type==="P"));if(!hasPawn){setStatus("WILD: 프로모션할 자신의 폰이 없습니다.");endTurn();return}cardDrawn=false;pendingChoice={type:"wildPawn"};requestChoiceUI();render()}
function showWild4Picker(){if(!pendingChoice||pendingChoice.type!=="wild4Choice"||!canOpenChoice())return;openModal(`<h2>WILD +4</h2><p>원하는 효과를 선택하세요.</p><div class="choice-grid"><button class="choice" id="wild4Revive">4부활</button><button class="choice" id="wild4Wild">WILD 카드</button></div>`);$("wild4Revive").onclick=()=>chooseWild4("revival");$("wild4Wild").onclick=()=>chooseWild4("wild")}
function chooseWild4(choice){if(!pendingChoice||pendingChoice.type!=="wild4Choice"||!canExecuteAction())return;if(ONLINE.started&&ONLINE.role==="guest"&&!ONLINE.applying){send("command",{action:"wild4",choice});return}pendingChoice=null;closeModal();if(choice==="revival")startRevival(4);else openWild()}
function showCardOwner(card,owner){const el=$("card");el.classList.remove("owner-white","owner-black");el.classList.add(owner==="w"?"owner-white":"owner-black");el.textContent=cardName(card)}
function showDeath(col){$("deathText").textContent=col==="w"?"WHITE DIED":"BLACK DIED";$("deathScreen").style.display="flex"}
function showCaptured(){const group=(list,col)=>list.length?list.map(p=>`<span class="captured-piece">${pieceChars[col][p.type]}</span>`).join(""):"없음";openModal(`<h2>잡은 기물</h2><div class="capture-columns"><div class="capture-box"><b>백이 잡은 기물</b><div>${group(dead.b,"b")}</div></div><div class="capture-box"><b>흑이 잡은 기물</b><div>${group(dead.w,"w")}</div></div></div><div class="modal-actions"><button id="closeCaptured">닫기</button></div>`);$("closeCaptured").onclick=closeModal}
function openModal(html){$("modalBox").innerHTML=html;$("modal").style.display="flex"}function closeModal(){$("modal").style.display="none"}
function drawLocal(animate=true){if(gameOver||cardDrawn||revivalState||pendingChoice)return false;const card=drawCard();if(!card){log("덱에 카드가 없습니다.");return false}lastCardOwner=currentPlayer;cardDrawn=true;if(!animate){discard.push(card);applyCard(card);render();return true}const f=document.createElement("div");f.className="flying-card "+(currentPlayer==="w"?"owner-white":"owner-black");f.textContent=cardName(card);$("cardStage").appendChild(f);f.onanimationend=()=>{f.remove();discard.push(card);applyCard(card);render();syncState()};return true}
function restartGame(){gameOver=false;deathColor=null;currentPlayer="w";turn=1;selected=null;cardDrawn=false;movesRemaining=0;movesUsedThisCard=0;deck=[];discard=[];dead={w:[],b:[]};lastMove=null;revivalState=null;lastCardOwner=null;pendingChoice=null;wildPromoPiece=null;reverseMode=false;closeModal();$("deathScreen").style.display="none";$("card").textContent="사용 카드";$("log").innerHTML="";setStatus("");createBoard();createDeck();render();log("새 게임 시작")}
function state(){return {board,currentPlayer,turn,selected,selectedFor:selected?currentPlayer:null,cardDrawn,movesRemaining,movesUsedThisCard,deck,discard,dead,gameOver,deathColor,lastMove,revivalState,lastCardOwner,pendingChoice,wildPromoPiece,reverseMode}}
function applyState(s){if(!s)return;const oldOver=gameOver;ONLINE.applying=true;board=s.board;currentPlayer=s.currentPlayer;turn=s.turn;selected=s.selectedFor===myColor()?s.selected:null;cardDrawn=s.cardDrawn;movesRemaining=s.movesRemaining;movesUsedThisCard=s.movesUsedThisCard;deck=s.deck;discard=s.discard;dead=s.dead;gameOver=s.gameOver;deathColor=s.deathColor||null;lastMove=s.lastMove;revivalState=s.revivalState;lastCardOwner=s.lastCardOwner;pendingChoice=s.pendingChoice;wildPromoPiece=s.wildPromoPiece;reverseMode=s.reverseMode;render();syncRemoteUI();if(!oldOver&&gameOver&&deathColor)showDeath(deathColor);ONLINE.applying=false}
function syncState(){if(ONLINE.role==="host"&&!ONLINE.applying)send("state",{state:state()})}
function syncRemoteUI(){const top=discard.at(-1),dkey=top?JSON.stringify(top)+"|"+lastCardOwner:"";if(dkey!==ONLINE.lastDiscardKey){ONLINE.lastDiscardKey=dkey;if(top&&ONLINE.role==="guest")animateCard(top,lastCardOwner);else if(top)showCardOwner(top,lastCardOwner)}else if(top)showCardOwner(top,lastCardOwner);if(pendingChoice&&myColor()===currentPlayer)requestChoiceUI();else if(!pendingChoice)closeModal()}
function animateCard(card,owner){const f=document.createElement("div");f.className="flying-card "+(owner==="w"?"owner-white":"owner-black");f.textContent=cardName(card);$("cardStage").appendChild(f);f.onanimationend=()=>{f.remove();showCardOwner(card,owner)}}
function validateGuest(m){if(!ONLINE.started||ONLINE.role!=="host"||gameOver||currentPlayer!=="b")return false;const inBoard=Number.isInteger(m.r)&&Number.isInteger(m.c)&&m.r>=0&&m.r<8&&m.c>=0&&m.c<8;switch(m.action){case"square":return inBoard&&!((pendingChoice&&["promotion","revival","wild4Choice"].includes(pendingChoice.type)))&&(cardDrawn||pendingChoice?.type==="wildPawn"||revivalState);case"draw":return!cardDrawn&&!revivalState&&!pendingChoice;case"end":return!pendingChoice&&!revivalState;case"promotion":return pendingChoice?.type==="promotion"&&inBoard&&["Q","R","B","N"].includes(m.piece);case"revival":return pendingChoice?.type==="revival"&&revivalState&&["P","N","B","R","Q"].includes(m.piece)&&dead.b.some(p=>p.type===m.piece);case"cancelRevival":return pendingChoice?.type==="revival"&&!!revivalState;case"wild4":return pendingChoice?.type==="wild4Choice"&&(m.choice==="revival"||m.choice==="wild");default:return false}}
function handleServerMessage(m){if(m.type==="room"){ONLINE.room=m.room;$("roomCode").textContent=m.room;$("onlineRoom").textContent=m.room;$("roomArea").style.display="block";$("joinArea").style.display="none";updatePlayers(m.players);return}if(m.type==="role"){ONLINE.role=m.role;$("roleBadge").textContent=m.role==="host"?"방장(백)":"참가자(흑)";render();return}if(m.type==="players"){updatePlayers(m.players);return}if(m.type==="start"){ONLINE.started=true;$("lobby").classList.add("hidden");$("game").style.visibility="visible";if(ONLINE.role==="host"){restartGame();syncState()}return}if(m.type==="state"){applyState(m.state);return}if(m.type==="command"&&ONLINE.role==="host"){if(!validateGuest(m))return;ONLINE.applying=true;try{if(m.action==="square")selectSquare(m.r,m.c);else if(m.action==="draw")drawLocal(false);else if(m.action==="end")manualEndTurn();else if(m.action==="promotion")promote(m.piece,m.r,m.c);else if(m.action==="revival")chooseRevival(m.piece);else if(m.action==="cancelRevival")cancelRevival();else if(m.action==="wild4")chooseWild4(m.choice)}finally{ONLINE.applying=false;syncState()}return}if(m.type==="error"){status(m.message,"error")}}
function status(t,cls=""){$("lobbyStatus").textContent=t;$(`lobbyStatus`).className="online-status "+cls}
function updatePlayers(p){$("whiteName").textContent=p?.white||"대기 중";$("blackName").textContent=p?.black||"대기 중";$("startOnline").style.display=ONLINE.role==="host"?"inline-block":"none";$("startOnline").disabled=!(p?.white&&p?.black&&ONLINE.role==="host")}
function connect(){ONLINE.ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);ONLINE.ws.onopen=()=>status("서버에 연결되었습니다.","ok");ONLINE.ws.onclose=()=>status("서버 연결이 끊겼습니다.","error");ONLINE.ws.onerror=()=>status("서버 연결 오류","error");ONLINE.ws.onmessage=e=>handleServerMessage(JSON.parse(e.data))}
$("createRoom").onclick=()=>{const n=$("nickname").value.trim()||"플레이어";send("create",{nickname:n})};$("joinRoom").onclick=()=>{$("joinArea").style.display="block";$("roomCodeInput").focus()};$("joinConfirm").onclick=()=>{const n=$("nickname").value.trim()||"플레이어",r=$("roomCodeInput").value.trim().toUpperCase();if(r.length!==6)return status("방 코드를 확인하세요.","error");send("join",{nickname:n,room:r})};$("startOnline").onclick=()=>send("start");$("leaveRoom").onclick=$("onlineLeave").onclick=()=>location.reload();$("deck").onclick=()=>{if(!localTurn())return;if(ONLINE.role==="guest")send("command",{action:"draw"});else drawLocal()};$("endTurnButton").onclick=()=>{if(!localTurn())return;if(ONLINE.role==="guest")send("command",{action:"end"});else{manualEndTurn();syncState()}};$("capturedButton").onclick=showCaptured;$("restartButton").onclick=()=>{if(ONLINE.role!=="host")return;restartGame();syncState()};$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};connect();restartGame();
</script>
</body>
</html>
